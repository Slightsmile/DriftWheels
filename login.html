<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to DriftWheels</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <div class="logo">DriftWheels</div>
        <div class="menu">
            <a href="index.html"><button>Home</button></a>
            <a href="login.html"><button>Login</button></a>
            <a href="signup.html"><button>Sign Up</button></a>
        </div>
    </div>

    <div class="login-container">
        <h1>Login to DriftWheels</h1>

        <div class="login-box">
            <form action="#" method="POST">

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" class="input-field" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="input-field" placeholder="Enter your password">
                </div>

                <button type="submit" class="action-btn">Login</button>

                <p class="switch-form-text">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>

            </form>
        </div>
    </div>

    <div class="footer">
        © 2026 DriftWheels
    </div>

</body>

</html>
