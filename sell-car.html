<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Your Car - DriftWheels</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <div class="logo">DriftWheels</div>
        <div class="menu">
            <a href="index.html"><button>Home</button></a>
            <a href="about-us.html"><button>About Us</button></a>
            <a href="login.html"><button>Login</button></a>
            <a href="signup.html"><button>Sign Up</button></a>
        </div>
    </div>

    <div class="sell-car-container">
        <h1>Sell Your Car</h1>

        <form class="sell-car-form">
            <h2>Car Information</h2>

            <div class="input-group">
                <label>Car Title</label>
                <input type="text" class="input-field" placeholder="e.g. Toyota Corolla X">
            </div>

            <div class="input-group">
                <label>Price (৳)</label>
                <input type="number" class="input-field" placeholder="e.g. 1000000">
            </div>

            <div class="input-group">
                <label>Model Year</label>
                <input type="number" class="input-field" placeholder="e.g. 2020">
            </div>

            <div class="input-group">
                <label>Condition</label>
                <select class="input-field">
                    <option value="">Select Condition</option>
                    <option value="new">New</option>
                    <option value="used">Used</option>
                    <option value="reconditioned">Reconditioned</option>
                </select>
            </div>

            <div class="input-group">
                <label>Mileage (km)</label>
                <input type="number" class="input-field" placeholder="e.g. 45000">
            </div>

            <div class="input-group">
                <label>Fuel Type</label>
                <select class="input-field">
                    <option value="">Select Fuel Type</option>
                    <option value="petrol">Petrol</option>
                    <option value="diesel">Diesel</option>
                    <option value="cng">CNG</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="electric">Electric</option>
                </select>
            </div>

            <div class="input-group">
                <label>Transmission</label>
                <select class="input-field">
                    <option value="">Select Transmission</option>
                    <option value="manual">Manual</option>
                    <option value="automatic">Automatic</option>
                </select>
            </div>

            <div class="input-group">
                <label>Color</label>
                <input type="text" class="input-field" placeholder="e.g. White">
            </div>

            <div class="input-group">
                <label>Location</label>
                <input type="text" class="input-field" placeholder="e.g. Dhaka, Bangladesh">
            </div>

            <div class="input-group">
                <label>Description</label>
                <textarea class="input-field" rows="5" placeholder="Describe your car in detail..."></textarea>
            </div>

            <h2>Upload Photos (Maximum 10)</h2>

            <div class="photo-upload-section">
                <div class="photo-upload-item">
                    <label>Photo 1</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 2</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 3</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 4</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 5</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 6</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 7</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 8</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 9</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="photo-upload-item">
                    <label>Photo 10</label>
                    <input type="file" accept="image/*">
                </div>
            </div>

            <h2>Seller Contact Information</h2>

            <div class="input-group">
                <label>Your Name</label>
                <input type="text" class="input-field" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" class="input-field" placeholder="Enter your phone number">
            </div>

            <button type="submit" class="action-btn">Submit Listing</button>
        </form>
    </div>

    <div class="footer">
        © 2026 DriftWheels. All rights reserved.
    </div>

</body>

</html>
