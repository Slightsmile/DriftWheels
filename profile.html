<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - DriftWheels</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <div class="logo">DriftWheels</div>
        <div class="menu">
            <a href="index.html"><button>Home</button></a>
            <a href="about-us.html"><button>About Us</button></a>
            <a href="profile.html"><button>Profile</button></a>
            <a href="login.html"><button>Logout</button></a>
        </div>
    </div>

    <div class="profile-container">
        <h1>User Profile</h1>

        <div class="profile-image-section">
            <img id="profileImage" src="https://via.placeholder.com/150" alt="Profile Picture">
            <br>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <form class="profile-form">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" class="input-field" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" class="input-field" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" class="input-field" placeholder="Enter your phone number">
            </div>

            <div class="input-group">
                <label>Address</label>
                <textarea class="input-field" rows="3" placeholder="Enter your address"></textarea>
            </div>

            <div class="input-group">
                <label>Bio</label>
                <textarea class="input-field" rows="4" placeholder="Tell us about yourself"></textarea>
            </div>

            <button type="submit" class="action-btn">Save Profile</button>
        </form>
    </div>

    <div class="footer">
        © 2026 DriftWheels. All rights reserved.
    </div>

</body>

</html>
